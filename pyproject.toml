[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envman"
version = "1.0.0"
description = "Manage .env files from the command line without losing comments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammad Abrar" }]
keywords = ["dotenv", "env", "cli", "configuration"]

[project.scripts]
envman = "envman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
